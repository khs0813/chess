services:
  - type: web
    name: chessstep-static
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: SITE_URL
        value: https://chess-yf3x.onrender.com
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: NAVER_SITE_VERIFICATION
        sync: false
      - key: GA_MEASUREMENT_ID
        sync: false
      - key: ADFIT_ENABLED
        value: "false"
      - key: ADFIT_ENABLE_EN
        value: "false"
      - key: ADFIT_DESKTOP_STICKY
        value: "true"
      - key: ADFIT_PLAY_DESKTOP_160X600
        sync: false
      - key: ADFIT_PLAY_TABLET_728X90
        sync: false
      - key: ADFIT_PLAY_MOBILE_320X50
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /favicon.svg
        name: Cache-Control
        value: public, max-age=604800
      - path: /rss.xml
        name: Content-Type
        value: application/rss+xml; charset=utf-8
    routes:
      - type: redirect
        source: /ko
        destination: /
      - type: redirect
        source: /ko/*
        destination: /*
